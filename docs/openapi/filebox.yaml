openapi: 3.1.0
info:
  title: FileBox API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in. Sets the SESSION cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Value of the XSRF-TOKEN cookie. Required on POST, PUT, PATCH and DELETE.
      schema:
        type: string
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    Account:
      type: object
      required: [id, email, emailVerified, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: [string, 'null']
        emailVerified:
          type: boolean
        hasPassword:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable machine-readable code, e.g. invalid_credentials
        requestId:
          type: string
  